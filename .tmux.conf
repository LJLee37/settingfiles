# ~/.tmux.conf -- kept in the settingfiles repo and symlinked by set.sh/Ansible.
#
# Standalone port of the parts of gpakosz/.tmux ("Oh my tmux!") worth keeping:
# the status bar look (session | uptime ... indicators | time | date | user |
# host), its key bindings and copy-mode tweaks. The ~2000-line shell layer
# behind Oh my tmux (battery, clipboard tools, fpp, plugin manager, background
# uptime loop) is left out on purpose.
#
# Needs tmux >= 3.2 (%hidden variables, formats inside styles).


# -- palette (Oh my tmux defaults, all xterm-256 palette colours) --------------

%hidden C_DARK="#080808"
%hidden C_GRAY="#303030"
%hidden C_LGRAY="#8a8a8a"
%hidden C_BLUE="#00afff"
%hidden C_YELLOW="#ffff00"
%hidden C_PINK="#ff00af"
%hidden C_RED="#d70000"
%hidden C_WHITE="#e4e4e4"

# Powerline separators need a Nerd/Powerline font (p10k already relies on one).
# Oh my tmux's own default was plain colour blocks; for that look set SEP_L and
# SEP_R to "" and SUB_R to "|".
%hidden SEP_L=""
%hidden SEP_R=""
%hidden SUB_R=""


# -- general -------------------------------------------------------------------

set -s escape-time 10       # faster command sequences (no Esc lag in nvim)
set -sg repeat-time 600     # increase repeat timeout
set -s focus-events on      # let nvim see focus changes
set -g history-limit 50000  # boost scrollback (applies to new panes)
set -g mouse on             # prefix m toggles it

# edit configuration (reloads it when the editor exits cleanly)
bind e new-window -n '~/.tmux.conf' '${VISUAL:-${EDITOR:-nvim}} ~/.tmux.conf && tmux source-file ~/.tmux.conf && tmux display "~/.tmux.conf sourced"'

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'


# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
bind 0 select-window -t :=10  # and make prefix 0 select window 10
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title
set -g set-titles-string '#h ❐ #S ● #I #W'

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line (and uptime) every 10 seconds

# activity
setw -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

bind C-c new-session                                             # create session
bind C-f command-prompt -p find-session 'switch-client -t %%'    # find session
bind BTab switch-client -l                                       # last session

# split current window, keeping the current path
bind - split-window -v -c '#{pane_current_path}'
bind _ split-window -h -c '#{pane_current_path}'

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation (prefix l is taken by pane navigation, so Tab replaces it)
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# toggle mouse
bind m set -g mouse \; display 'mouse: #{?mouse,on,off}'


# -- copy mode -----------------------------------------------------------------

# y goes to the tmux buffer and, via OSC 52, to the local terminal's clipboard
# when that terminal supports it (tmux default set-clipboard=external).
setw -g mode-keys vi
bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line


# -- buffers -------------------------------------------------------------------

bind b list-buffers     # list paste buffers
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from


# -- theme ---------------------------------------------------------------------

set -g status-style "fg=$C_LGRAY,bg=$C_DARK"
set -g message-style "fg=$C_DARK,bg=$C_YELLOW,bold"
set -g message-command-style "fg=$C_YELLOW,bg=$C_DARK,bold"
setw -g mode-style "fg=$C_DARK,bg=$C_YELLOW,bold"

# active border: yellow in copy mode, red while panes are synchronized
setw -g pane-border-style "fg=$C_GRAY"
setw -g pane-active-border-style "#{?pane_in_mode,fg=$C_YELLOW,#{?pane_synchronized,fg=$C_RED,fg=$C_BLUE}}"
set -g display-panes-colour "$C_BLUE"
set -g display-panes-active-colour "$C_BLUE"

setw -g clock-mode-colour "$C_BLUE"
setw -g clock-mode-style 24

# window list: " 1 zsh ", bell adds "!", zoom adds "Z"
%hidden WIN_FLAGS="#{?#{||:#{window_bell_flag},#{window_zoomed_flag}}, ,}#{?window_bell_flag,!,}#{?window_zoomed_flag,Z,}"
setw -g window-status-separator ''
setw -g window-status-style "fg=$C_LGRAY,bg=$C_DARK"
setw -g window-status-format " #I #W$WIN_FLAGS "
setw -g window-status-current-style "fg=$C_DARK,bg=$C_BLUE,bold"
setw -g window-status-current-format "#[fg=$C_DARK,bg=$C_BLUE]$SEP_L#[fg=$C_DARK,bg=$C_BLUE,bold] #I #W$WIN_FLAGS #[fg=$C_BLUE,bg=$C_DARK,none]$SEP_L"
setw -g window-status-activity-style 'underscore'
setw -g window-status-bell-style "fg=$C_YELLOW,blink,bold"
setw -g window-status-last-style "fg=$C_BLUE,bg=$C_GRAY"

# Uptime as " 3d 4h 12m" (zero parts dropped, like Oh my tmux). One short
# `cut` per status-interval; the arithmetic is done by tmux itself.
%hidden UP="#(cut -d. -f1 /proc/uptime)"
%hidden UP_D="#{e|/:$UP,86400}"
%hidden UP_H="#{e|-:#{e|/:$UP,3600},#{e|*:$UP_D,24}}"
%hidden UP_M="#{e|-:#{e|/:$UP,60},#{e|*:#{e|/:$UP,3600},60}}"
%hidden UPTIME="↑#{?$UP_D, ${UP_D}d,}#{?$UP_H, ${UP_H}h,}#{?$UP_M, ${UP_M}m,}"

# prefix pressed, mouse on, several clients attached, panes synchronized
%hidden INDICATORS="#{?client_prefix,⌨ ,}#{?mouse,↗ ,}#{?session_many_attached,⚇ ,}#{?pane_synchronized,⚏ ,}"
%hidden ANY_INDICATOR="#{||:#{||:#{client_prefix},#{mouse}},#{||:#{session_many_attached},#{pane_synchronized}}}"

set -g status-left-length 1000
set -g status-right-length 1000

# left: yellow session | pink uptime
set -g status-left "#[fg=$C_DARK,bg=$C_YELLOW,bold] ❐ #S #[fg=$C_YELLOW,bg=$C_PINK,none]$SEP_L#[fg=$C_WHITE,bg=$C_PINK] $UPTIME #[fg=$C_PINK,bg=$C_DARK]$SEP_L"

# right: grey indicators / time / date | red user ("!" when root) | white host
set -g status-right "#[fg=$C_LGRAY,bg=$C_DARK] $INDICATORS#{?$ANY_INDICATOR,$SUB_R ,}%R $SUB_R %d %b #[fg=$C_RED,bg=$C_DARK]$SEP_R#[fg=$C_WHITE,bg=$C_RED] #{user}#{?#{==:#{user},root},!,} #[fg=$C_WHITE,bg=$C_RED]$SEP_R#[fg=$C_DARK,bg=$C_WHITE,bold] #h "
